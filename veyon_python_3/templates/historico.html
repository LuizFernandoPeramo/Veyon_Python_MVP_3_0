<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Histórico - Veyon Python</title><style>body{font:15px system-ui;max-width:1100px;margin:30px auto;padding:0 15px;background:#f3f5f9;color:#233}article{background:white;border-radius:10px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}img{width:100%;border-radius:6px}a{color:#b01920}</style><h2>Histórico de capturas</h2><a href="{{url_for('index')}}">Voltar ao painel</a><article><form method="get"><label>Computador: <select name="host"><option value="">Todos</option>{% for id, pc in hosts.items() %}<option value="{{id}}" {% if selected==id %}selected{% endif %}>{{pc.nome}}</option>{% endfor %}</select></label><button>Filtrar</button></form></article><div class="grid">{% for e in entries %}<article><a href="{{url_for('image',entry_id=e.id)}}" target="_blank" rel="noopener"><img src="{{url_for('image',entry_id=e.id)}}" loading="lazy" alt="Captura"></a><p><strong>{{e.aluno_nome}}</strong></p><small>{{e.host_id}} · {{e.capturado_em}}</small></article>{% else %}<p>Sem imagens no histórico.</p>{% endfor %}</div></html>
