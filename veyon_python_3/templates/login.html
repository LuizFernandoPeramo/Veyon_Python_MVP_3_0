<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Veyon Python - Login</title><style>body{font:16px system-ui;background:#f2f4f8;color:#172032;display:grid;place-items:center;min-height:90vh}.panel{background:white;border-radius:14px;padding:30px;width:min(90%,390px);box-shadow:0 7px 28px #0001}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:10px 0}button{background:#c4161c;color:white;border:0;border-radius:7px;cursor:pointer}</style><div class="panel"><h2>Veyon Python 3.0</h2><p>Acesso restrito ao professor autorizado.</p>{% for msg in get_flashed_messages() %}<p>{{msg}}</p>{% endfor %}<form method="post"><label>Senha do painel<input name="senha" type="password" required autofocus></label><button>Entrar</button></form></div></html>
